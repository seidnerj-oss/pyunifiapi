[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyunifiapi"
version = "0.1.0"
description = "Python client for UniFi Network controller and cloud API over WebRTC"
readme = "README.md"
requires-python = ">=3.14"
license = { file = "LICENSE" }
authors = [{ name = "seidnerj" }]
keywords = ["unifi", "ubiquiti", "python", "webrtc", "network-controller"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Development Status :: 3 - Alpha",
]
dependencies = [
    "httpx",
    "pyotp",
    "websockets",
]

[project.optional-dependencies]
cloud = [
    # Pre-release marker (>=X.dev0) is intentional: stable 2025.1.2 lacks
    # aarch64 wheels for manylinux_2_36 (Raspberry Pi OS). The pre-release
    # 2026.1.0.dev1 has compatible aarch64 wheels. PEP 440 requires a
    # pre-release in the specifier to allow pre-release resolution.
    "libdatachannel-py>=2025.1.2.dev0",
]

[project.urls]
Homepage = "https://github.com/seidnerj/pyunifiapi"
Repository = "https://github.com/seidnerj/pyunifiapi"
Issues = "https://github.com/seidnerj/pyunifiapi/issues"

[project.scripts]
pyunifiapi = "pyunifiapi.cli.__main__:main"

[dependency-groups]
dev = [
    "basedpyright",
    "mypy",
    "pre-commit",
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
indent-width = 4
line-length = 150
# ruff does not yet support py314; using py313 as the closest available target
target-version = "py313"

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.14"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true

[tool.basedpyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.uv]
required-version = ">=0.10"
